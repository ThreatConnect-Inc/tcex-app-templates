exclude: ^deps
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=15000']
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: detect-aws-credentials
        args:
          - '--allow-missing-credentials'
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: no-commit-to-branch
        args:
          - --branch
          - main
          - --branch
          - qa
      - id: pretty-format-json
        args:
          - --autofix
        exclude: '^tests/.+/profiles.d/.*|^tests/.+/staged_requests/.*'
      - id: requirements-txt-fixer
      - id: trailing-whitespace
  - repo: https://github.com/pycqa/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [--exclude, tests]
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args:
          - --py311-plus
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff-check
        args:
          - --fix
        types_or: [ python, pyi ]
      - id: ruff-format
        types_or: [ python, pyi ]

  - repo: https://github.com/pypa/pip-audit
    rev: v2.9.0
    hooks:
      - id: pip-audit
        args: ['--path', 'deps', '--vulnerability-service', 'osv']
  - repo: local
    hooks:
      - id: update-manifest-after-template-change
        name: Update manifest after template change
        language: python
        entry: python scripts/update_manifest_post_commit.py
        pass_filenames: false
        always_run: true
        stages: [post-commit]
        additional_dependencies:
          - pyyaml>=6.0
