[tool.ruff]
exclude = ["tests", "_test_inits"]
line-length = 100
src = ["."]
target-version = "py311"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 60
indent-style = "space"
line-ending = "auto"
quote-style = "single"
skip-magic-trailing-comma = false

[tool.ruff.lint]
ignore = [
  'BLE001',
  'D400',
  'D401',
  'D415',
  'EM101',
  'EM102',
  'FBT001',
  'FBT002',
  'FBT003',
  'G004',
  'PGH003',
  'PLR0913',
  'PLR2004',
  'PLW2901',
  'RET504',
  'SIM102',
  'SIM103',
  'SIM108',
  'SIM117',
  'TC001',
  'TC002',
  'TC003',
  'TRY003',
  'TRY300',
  'INP001',
]
select = [
  "A",
  "ARG",
  "B",
  "BLE",
  "C4",
  "C90",
  "D",
  "DJ",
  "DTZ",
  "E",
  "EM",
  "EXE",
  "F",
  "FBT",
  "G",
  "ICN",
  "INP",
  "ISC",
  "N",
  "NPY",
  "PD",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "RET",
  "RSE",
  "RUF",
  "SIM",
  "SLF",
  "T10",
  "T20",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["F401"]
"scripts/*.py" = ["T201", "EXE001", "D101", "D102", "D103", "D107"]
"tie/build_manifest.py" = ["T201", "EXE001"]


[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "tcex.logger.trace_logger.TraceLogger"]
runtime-evaluated-decorators = ["pydantic.BaseModel", "tcex.logger.trace_logger.TraceLogger"]

[tool.ruff.lint.pydocstyle]
convention = "google"
