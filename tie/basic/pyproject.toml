[tool.black]
line-length = 100
skip-string-normalization = true

[codespell]
# ignore-words-list=
skip = "*.history,lib_*,local-*"

[tool.pydocstyle]
ignore = [
  "D202", # no blank lines allowed after function docstring
  "D203", # 1 blank line required before class docstring (found 0)
  "D213", # Multi-line docstring summary should start at the second line
  "D400", # First line should end with a period ...
  "D406", # Section name should end with a newline ...
  "D407", # Missing dashed underline after section ...
  "D413", # Missing blank line after last section ...
  "D415", # First line should end with a period, question mark, or exclamation point ...
]

[tool.pyright]
# https://github.com/microsoft/pyright/blob/main/docs/configuration.md#sample-pyprojecttoml-file
exclude = [
  "**/.history",
  "**/__pycache__",
  "**/deps",
  "**/deps_tests",
  "**/local-*",
  "**/tests",
]
pythonPlatform = "Linux"
pythonVersion = "3.11"
reportPrivateImportUsage = false
reportAttributeAccessIssue = false
reportOptionalMemberAccess = false
reportCallIssue = false
reportArgumentType = false

[tool.pytest.ini_options]
filterwarnings = []
junit_family = "xunit2"
testpaths = [
  "tests",
]


[tool.ruff.format]
# https://docs.astral.sh/ruff/formatter/

docstring-code-format = true
docstring-code-line-length = 100
indent-style = "space"
line-ending = "auto"
quote-style = "single"
skip-magic-trailing-comma = false

[tool.ruff.lint]
# https://docs.astral.sh/ruff/linter/

# control "--fix" behavior.
# fixable = []
# unfixable = []

ignore = [
  "BLE001", # Do not catch blind exception: ...
  "B008", # Temp here but will remove
  "D415", # First line should end with a period, question mark, or exclamation point ...
  "FBT001", # Boolean-typed positional argument in function definition
  "FBT002", # Boolean default positional argument in function definition
  "FBT003", # Boolean default positional argument in function definition
  "G004", # Logging statement uses f-string
  "PGH003", # Use specific rule codes when ignoring type issues
  "PT006", # Wrong name(s) type in ..., expected ...
  "TC001", # Move application import ... into a type-checking block
  "TC002", # Move third-party import ... into a type-checking block
  "TC003", # Typing Only Standard Library Import
  "SIM117", # Multiple With Statements
  "PLW2901", # Redefined Loop Name
  "RET504", # Unnecessary Assign
  "PLR2004", # Magic Value Comparison
  "SIM103", # Needless Bool
  "SIM108", # If Else Block Instead Of If Exp
  "TRY300", # Try Consider Else
  "N999" # Invalid Module Name
]

# control enabled plugins
select = [
  "A", # flake8-builtins
  "ARG", # flake8-unused-arguments
  "B", # flake8-bugbear
  "BLE", # flake8-blind-except
  "C", # flake8-comprehensions
  "C4", # flake8-comprehensions
  "C90", # mccabe
  "D", # pydocstyle
  "DJ", # flake8-django
  "DTZ", # flake8-datetimez
  "E", # pycodestyle
  "W", # pycodestyle
  "E", # pycodestyle
  "EM", # flake8-errmsg
  "EXE", # flake8-executable
  "F", # Pyflakes
  "FBT", # flake8-boolean-trap
  "G", # flake8-logging-format
  "I", # isort
  "ICN", # flake8-import-conventions
  "INP", # flake8-no-pep420
  "ISC", # flake8-implicit-str-concat
  "N", # pep8-naming
  "NPY", # NumPy-specific
  "PD", # pandas-vet
  "PGH", # pygrep-hooks
  "PIE", # flake8-pie
  "PL", # Pylint
  "PLC", # Convention
  "PLE", # Error
  "PLR", # Refactor
  "PLW", # Warning
  "PT", # flake8-pytest-style
  "PTH", # flake8-use-pathlib
  "PYI", # flake8-pyi
  "RET", # flake8-return
  "RSE", # flake8-raise
  "RUF", # Ruff-specific
  "SIM", # flake8-simplify
  "SLF", # flake8-self
  "T10", # flake8-debugger
  "T20", # flake8-print
  "TCH", # flake8-type-checking
  "TID", # flake8-tidy-imports
  "TRY", # tryceratops
  "UP", # pyupgrade
  "W", # pycodestyle
  "YTT", # flake8-2020
]

# Other Options
# "ANN", # flake8-annotations
# "COM", # flake8-commas
# "ERA", # eradicate
# "S", # flake8-bandit
# "Q", # flake8-quotes

[tool.ruff]
line-length = 100

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "tcex.logger.trace_logger.TraceLogger"]
runtime-evaluated-decorators = ["pydantic.BaseModel", "tcex.logger.trace_logger.TraceLogger"]

[tool.ruff.lint.pydocstyle]
# https://docs.astral.sh/ruff/linter/

convention = "google"
