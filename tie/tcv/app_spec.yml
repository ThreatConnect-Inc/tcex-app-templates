sections:
- params:
  - default: 2 Hours
    feedDeployer: true
    serviceConfig: true
    label: Notification Digest Interval
    name: notification_digest_interval
    note: How often pipeline health digest notifications are sent.
    type: Choice
    validValues:
    - 1 Hour
    - 2 Hours
    - 3 Hours
    - 4 Hours
  - allowMultiple: true
    feedDeployer: true
    serviceConfig: true
    default: App Startup|Job Retrying|Job Failed|Job Recovered
    label: Notification Types
    name: notification_types
    note: Which notification types are sent via TC Notification API. Shutdown
      notifications are always sent regardless of this setting.
    type: MultiChoice
    validValues:
    - App Startup
    - Job Retrying
    - Job Failed
    - Job Recovered
